apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: discord
  namespace: observability
spec:
  route:
    receiver: discord
    groupBy: [alertname, namespace]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            name: discord-wh
            key: url
          title: '{{ .CommonLabels.alertname }}'
          message: '{{ .CommonAnnotations.summary }}'
