        - IT-Tools:
            - icon: https://cdn-icons-png.flaticon.com/512/868/868784.png
              href: https://it-tools.tech/
        - Privacy-Card:
            - icon: https://play-lh.googleusercontent.com/xcIH2rg95sUMnhLZiQmMMuuj-GL2VuKtDjfmbvGbf5ODUCTob2DyxOoc_ZRCp9s96w=w240-h480-rw
              href: https://app.privacy.com/home
  docker.yaml: ""
  services.yaml: ""
  settings.yaml: |
    background:
      image: https://i.ibb.co/Q7FSHG3v/photo-1622737133809-d95047b9e675.jpg # https://i.redd.it/7pgm8d9j1er71.png # https://images4.alphacoders.com/106/1068731.jpg
      blur: md
      opacity: 95

    providers:
      openweathermap: openweathermapapikey
      weatherapi: weatherapiapikey
    target: _self
    theme: dark
    color: slate
    hideErrors: true
    hideVersion: true
    # headerStyle: boxed
    layout:
      Media:
        style: row
        columns: 4
  widgets.yaml: |
    # - resources:
    #     cpu: true
    #     memory: true
    #     disk: /

    - search:
        provider: google
        target: _blank

    - datetime:
        text_size: md
        format:
          timeStyle: short

    - weatherapi:
        #label: Home # optional
        latitude: "{{HOMEPAGE_VAR_LATITUDE}}"
        longitude: "{{HOMEPAGE_VAR_LONGITUDE}}"
        units: imperial # or metric
        apiKey: "{{HOMEPAGE_VAR_WEATHER_API_KEY}}"
        cache: 5 # Time in minutes to cache API responses, to stay within limits

    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    # - resources:
    #     backend: resources
    #     expanded: true
    #     cpu: true
    #     memory: true
    #     network: default
