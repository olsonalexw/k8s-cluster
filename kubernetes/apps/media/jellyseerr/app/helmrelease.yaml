---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      seerr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          seerr:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.1.0
            env:
              TZ: ${TIMEZONE}
              LOG_LEVEL: "info"
              PORT: &port 80
              DB_TYPE: "postgres"
              DB_HOST: postgres-pgbouncer.database.svc.cluster.local
              DB_PORT: 5432
              DB_NAME: seerr
              DB_USER: seerr
              DB_PASS:
                valueFrom:
                  secretKeyRef:
                    name: seerr-db-secret
                    key: password
            resources:
              requests:
                cpu: 49m
                memory: 352M
              limits:
                memory: 1028M
    service:
      seerr:
        controller: seerr
        ports:
          http:
            port: *port
    ingress:
      seerr:
        enabled: true
        className: traefik-external
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: "network-chain-no-auth@kubernetescrd"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Seerr
          gethomepage.dev/group: Media
          gethomepage.dev/icon: seerr.png
          gethomepage.dev/description: Media Request Agent
          gethomepage.dev/href: https://seerr.${SECRET_DOMAIN}
        hosts:
          - host: &host "seerr.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: seerr
                  port: http
        tls:
          - hosts:
              - *host
            secretName: "${SECRET_DOMAIN/./-}-production-tls"
    persistence:
      config:
        enabled: true
        storageClass: nfs-csi
        accessMode: ReadWriteMany
        size: 2Gi
        globalMounts:
          - path: /app/config
      config-logs:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/config/logs
      tmp:
        type: emptyDir
    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "Always"
