# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
  namespace: media
spec:
  releaseName: unpackerr
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  dependsOn:
    - name: csi-driver-nfs
      namespace: storage
  values:
    controllers:
      main:
        type: deployment
        strategy: Recreate
        containers:
          main:
            image:
              repository: golift/unpackerr
              pullPolicy: IfNotPresent
              tag: v0.16.1@sha256:244fc45cb207308f60e8f52dd703c2b3463385752de0f9517c58ff9d331ed15e
            env:
              TZ: ${TIMEZONE}
              UN_SONARR_0_URL: "http://sonarr.media.svc.cluster.local:8989"
              UN_RADARR_0_URL: "http://radarr.media.svc.cluster.local:7878"
            envFrom:
              - secretRef:
                  name: unpackerr
            resources:
              requests:
                cpu: 20m
                memory: 400M
              limits:
                memory: 2056M
    persistence:
      downloads:
        enabled: true
        existingClaim: nfs-torrents-pvc
        globalMounts:
          - path: /downloads

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "Always"
