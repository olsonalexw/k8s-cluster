# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plik
  namespace: media
spec:
  releaseName: plik
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        type: deployment
        strategy: Recreate
        containers:
          main:
            image:
              repository: rootgg/plik
              tag: 1.4.2
            env:
              TZ: ${TIMEZONE}
              PLIKD_DOWNLOAD_DOMAIN: "https://dl.${SECRET_DOMAIN}"
              PLIKD_DATA_BACKEND_CONFIG: '{"Directory":"/files"}'
              PLIKD_METADATA_BACKEND_CONFIG: '{"Driver":"sqlite3","ConnectionString":"/config/plik.db"}'
              PLIKD_FEATURE_AUTHENTICATION: "forced"
              PLIKD_DEFAULT_TTL_STR: "2d"
              # PLIKD_SOURCE_IP_HEADER: "X-FORWARDED-FOR"
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1028Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    persistence:
      config:
        enabled: true
        storageClass: nfs-csi
        accessMode: ReadWriteMany
        size: 100Mi
      files:
        enabled: true
        storageClass: nfs-csi
        accessMode: ReadWriteMany
        size: 10Gi

    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "Always"
