# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: media
spec:
  releaseName: plex
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 3.6.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  dependsOn:
    - name: nvidia-device-plugin
      namespace: kube-system
    - name: csi-driver-nfs
      namespace: storage
  values:
    initContainers:
      setup-nvidia-libs:
        image: alpine:latest
        command:
          - /bin/sh
          - -c
          - |
            # Link the driver files into our clean volume
            ln -sf /usr/local/glibc/usr/lib/libnvidia-encode.so* /nvidia-libs/
            ln -sf /usr/local/glibc/usr/lib/libnvcuvid.so* /nvidia-libs/
            ln -sf /usr/local/glibc/usr/lib/libcuda.so* /nvidia-libs/
        securityContext:
          runAsUser: 0

    controllers:
      main:
        type: deployment
        strategy: Recreate
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/plex
              tag: latest
            env:
              TZ: ${TIMEZONE}
              PUID: "1001"
              PGID: "1001"
              NVIDIA_VISIBLE_DEVICES: all
              NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
              LD_LIBRARY_PATH: "/nvidia-libs"
            resources:
              requests:
                nvidia.com/gpu: 1
              limits:
                nvidia.com/gpu: 1
        type: deployment
        strategy: Recreate
        containers:
          main:
            image:
              # repository: plexinc/pms-docker
              repository: lscr.io/linuxserver/plex
              tag: latest
            env:
              TZ: ${TIMEZONE}
              PUID: "1001"
              PGID: "1001"
              NVIDIA_VISIBLE_DEVICES: all
              NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
              LD_LIBRARY_PATH: "/usr/lib/x86_64-linux-gnu:/usr/local/glibc/usr/lib"
            resources:
              requests:
                cpu: 49m
                memory: 2049M
                nvidia.com/gpu: 1
              limits:
                memory: 4046M
                nvidia.com/gpu: 1
    service:
      main:
        controller: main
        ports:
          http:
            port: 32400
    ingress:
      main:
        enabled: true
        className: traefik-internal
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: "network-chain-no-auth-restrict-networks@kubernetescrd"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Plex
          gethomepage.dev/group: Media
          gethomepage.dev/icon: plex.png
          gethomepage.dev/description: Media Player
          gethomepage.dev/href: https://plex.${SECRET_DOMAIN}
        hosts:
          - host: &host "plex.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host
            secretName: "${SECRET_DOMAIN/./-}-production-tls"

    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: nfs-csi
        accessMode: ReadWriteMany
        size: 2Gi
      media:
        enabled: true
        existingClaim: nfs-media-pvc
      transcode:
        enabled: true
        type: emptyDir
      talos-glibc:
        enabled: true
        type: hostPath
        hostPath: /usr/local/glibc
        globalMounts:
          - path: /usr/local/glibc
            readOnly: true
      nvidia-libs:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /nvidia-libs

    defaultPodOptions:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.feature.node.kubernetes.io/gpu: "true"
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "Always"
