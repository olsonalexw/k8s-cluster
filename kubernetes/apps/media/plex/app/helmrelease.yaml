# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: media
spec:
  releaseName: plex
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  dependsOn:
    - name: nvidia-device-plugin
      namespace: kube-system
  values:
    controllers:
      main:
        type: deployment
        strategy: Recreate
        initContainers:
          cuda-symlink:
            image:
              repository: busybox
              tag: 1.37
              pullPolicy: IfNotPresent
            command:
              - /bin/sh
              - -c
            args:
              - |
                set -e
                mkdir -p /plex-libs/lib
                ln -sf /usr/local/glibc/usr/lib/libcuda.so.1 /plex-libs/lib/libcuda.so.1
                ln -sf /usr/local/glibc/usr/lib/libcuda.so /plex-libs/lib/libcuda.so
                ln -sf /usr/local/glibc/usr/lib/libcuda.so.570.195.03 /plex-libs/lib/libcuda.so.570.195.03
                for lib in /usr/local/glibc/usr/lib/libnvidia-encode.so* /usr/local/glibc/usr/lib/libnvcuvid.so* /usr/local/glibc/usr/lib/libnvidia-ml.so* /usr/local/glibc/usr/lib/libcudadebugger.so* ; do
                  if [ -f "$lib" ]; then
                    ln -sf "$lib" /plex-libs/lib/$(basename "$lib")
                  fi
                done
                echo "Symlinks created in shared volume:"
                ls -l /plex-libs/lib | grep -E 'cuda|nvidia|cuvid|encode|ml|debugger' || echo "No matching symlinks"
        containers:
          main:
            image:
              # repository: ghcr.io/home-operations/plex
              # repository: plexinc/pms-docker
              repository: linuxserver/plex
              tag: 1.42.2@sha256:1720efa8e919a724ff3003cce7c1c0ae91a54e097ca3c8f6713a780c6fd73432
            env:
              TZ: ${TIMEZONE}
              PUID: "1001"
              PGID: "1001"
              NVIDIA_VISIBLE_DEVICES: all
              NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
              LD_LIBRARY_PATH: "/plex-libs/lib:/usr/lib/plexmediaserver/lib:/usr/local/glibc/usr/lib:/usr/lib"
            resources:
              requests:
                cpu: 49m
                memory: 2048M
                nvidia.com/gpu: 1
              limits:
                memory: 4046M
                nvidia.com/gpu: 1

    service:
      main:
        controller: main
        ports:
          http:
            port: 32400

    persistence:
      plex-libs:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /plex-libs
      config:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: plex-config
      media:
        enabled: true
        existingClaim: nfs-media-pvc
      transcode:
        enabled: true
        type: emptyDir

    defaultPodOptions:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.feature.node.kubernetes.io/gpu: "true"
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
