---
# ServersTransport: Skip verification for the router's self-signed cert
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: flint3-insecure
  namespace: network
spec:
  insecureSkipVerify: true

---
# ExternalName Service pointing to Flint 3's LAN IP
apiVersion: v1
kind: Service
metadata:
  name: flint3-webui
  namespace: network
spec:
  type: ExternalName
  externalName: 192.168.1.1

---
# IngressRoute: Public route to the backend
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flint3-webui
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`router.${SECRET_DOMAIN}`)
      kind: Rule
      services:
        - name: flint3-webui
          kind: Service
          port: 443
          scheme: https
          serversTransport: flint3-insecure
          passHostHeader: true
      middlewares:
        - name: network-chain-no-auth-restrict-networks@kubernetescrd
        - name: flint3-host-override
  tls:
    secretName: "${SECRET_DOMAIN/./-}-production-tls"
