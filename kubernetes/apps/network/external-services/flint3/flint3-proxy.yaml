---
# Optional but recommended: ServersTransport to skip self-signed cert verification
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: flint3-insecure
  namespace: network
spec:
  insecureSkipVerify: true

---
# Kubernetes Service (ExternalName) pointing to your Flint 3's real IP
apiVersion: v1
kind: Service
metadata:
  name: flint3-webui
  namespace: network
spec:
  type: ExternalName
  externalName: 192.168.1.1          # Flint 3's LAN IP

---
# IngressRoute referencing the ExternalName Service
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flint3-webui
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`router.${SECRET_DOMAIN}`)
      kind: Rule
      services:
        - name: flint3-webui
          kind: Service                   # ← Standard Kubernetes Service
          port:
            number: 443                   # Target the router's HTTPS port
          scheme: https                   # Tell Traefik to use HTTPS to backend
          serversTransport: flint3-insecure  # Skip cert verification
          passHostHeader: true            # Often needed for GL.iNet panels
      middlewares:
        - name: network-chain-no-auth-restrict-networks@kubernetescrd
  tls:
    secretName: "${SECRET_DOMAIN/./-}-production-tls"
