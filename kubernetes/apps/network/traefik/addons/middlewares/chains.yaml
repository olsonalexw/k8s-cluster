---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: chain-no-auth
spec:
  chain:
    middlewares:
      - name: network-traefik-middleware-rate-limit@kubernetescrd
      - name: network-traefik-middleware-secure-headers@kubernetescrd
      - name: network-traefik-middleware-compress@kubernetescrd
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: chain-no-auth-restrict-networks
spec:
  chain:
    middlewares:
      - name: network-traefik-middleware-only-local@kubernetescrd
      - name: network-traefik-middleware-rate-limit@kubernetescrd
      - name: network-traefik-middleware-secure-headers@kubernetescrd
      - name: network-traefik-middleware-compress@kubernetescrd
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: chain-external-services-no-auth-restrict-networks
spec:
  chain:
    middlewares:
      - name: network-traefik-middleware-only-local@kubernetescrd
      - name: network-traefik-middleware-secure-headers-external-services@kubernetescrd
      - name: network-traefik-middleware-compress@kubernetescrd
