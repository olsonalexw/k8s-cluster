apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pgdata
spec:
  storageClassName: openebs-hostpath
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /var/mnt/apps/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["kube03"]
