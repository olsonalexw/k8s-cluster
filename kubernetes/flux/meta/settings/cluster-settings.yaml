---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1.18.1-standalone-strict/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "cert-manager,dashboard,database,external-secrets,kube-system,media,network,observability,security,storage"
data:
  TIMEZONE: "America/Detroit"
  IPAM_IP_TRAEFIK_INTERNAL: 192.168.1.50
  IPAM_IP_TRAEFIK_EXTERNAL: 192.168.1.49
  IPAM_IP_ADGUARDHOME: 192.168.1.1
  IPAM_IP_ADGUARDHOME_INTERNAL: 10.96.0.11
